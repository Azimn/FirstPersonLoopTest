name: DUCKHunter v0.4.1 fresh adversarial tests

on:
  push:
    branches: [duckhunter-v041-eval-20260911]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run v0.4.1 baseline suite
        working-directory: subjective_character_loop_v0_4
        run: python -m unittest -v test_boundaries.py test_continuation.py test_initiation.py test_v041_hardening.py
      - name: Run fresh Duckhunter v0.4.1 probes
        working-directory: subjective_character_loop_v0_4
        run: python -m unittest -v test_duckhunter_v041_fresh.py
