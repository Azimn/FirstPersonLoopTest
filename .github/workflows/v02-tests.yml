name: v0.2 first-person loop tests

on:
  push:
    branches:
      - v0.2-first-person-continuation
  pull_request:
    paths:
      - 'subjective_character_loop_v0_2/**'
      - '.github/workflows/v02-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        working-directory: subjective_character_loop_v0_2
        run: python -m unittest -v
      - name: Run deterministic smoke session
        working-directory: subjective_character_loop_v0_2
        run: |
          printf 'Hello Doctor, what are you working on?\n/idle 2 15\n/quit\n' | python subjective_loop.py --provider scripted --character pretorius --min-thoughts 2 --max-thoughts 2 --db smoke.sqlite3
