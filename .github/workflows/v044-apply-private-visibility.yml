name: apply v0.4.4 private visibility invariant

on:
  push:
    branches: [v0.4.4-private-visibility-freeze]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply v0.4.4 private visibility invariant'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.4.4-private-visibility-freeze
      - name: Apply narrow privacy invariant correction
        run: python tools/apply_v044_private_visibility.py
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subjective_character_loop_v0_4/loopcore.py
          git commit -m 'Apply v0.4.4 private visibility invariant'
          git push origin HEAD:v0.4.4-private-visibility-freeze
